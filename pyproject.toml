[project]
name = "rail-incident-intelligence"
version = "0.1.0"
description = "Pipeline for extracting structured maintenance incident data from heterogeneous rail operator reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Oscar" },
]
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "typer>=0.12,<1",
    "pandas>=2.0,<3",
    "openai>=1.40,<2",
]

[project.scripts]
rail-ii = "rail_ii.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rail_ii"]

# ---------- Dev dependencies (uv groups) ----------
[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
]

# ---------- Ruff ----------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["rail_ii"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
